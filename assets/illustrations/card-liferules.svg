<svg viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2e8c0"/>
      <stop offset="20%"  stop-color="#f0d07a"/>
      <stop offset="45%"  stop-color="#e8a832"/>
      <stop offset="65%"  stop-color="#d07c18"/>
      <stop offset="82%"  stop-color="#b85c0c"/>
      <stop offset="100%" stop-color="#9a4208"/>
    </linearGradient>
    <radialGradient id="lr-sun-glow" cx="36%" cy="54%" r="38%">
      <stop offset="0%"   stop-color="#fff8c0" stop-opacity="0.9"/>
      <stop offset="20%"  stop-color="#f8e060" stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#e8a020" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d08010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lr-horizon-glow" cx="50%" cy="72%" r="45%">
      <stop offset="0%"   stop-color="#f8d040" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#e09020" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c07010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lr-hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a87840"/>
      <stop offset="100%" stop-color="#8a5c28"/>
    </linearGradient>
    <linearGradient id="lr-hill-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a5228"/>
      <stop offset="100%" stop-color="#5e3c18"/>
    </linearGradient>
    <linearGradient id="lr-hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3e2408"/>
    </linearGradient>
    <linearGradient id="lr-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a2c10"/>
      <stop offset="100%" stop-color="#301808"/>
    </linearGradient>
    <radialGradient id="lr-vign" cx="50%" cy="50%" r="72%">
      <stop offset="48%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#1e0e04" stop-opacity="0.68"/>
    </radialGradient>
    <filter id="lr-mist"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="lr-soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="lr-glow"><feGaussianBlur stdDeviation="10" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="lr-paint">
      <feTurbulence type="fractalNoise" baseFrequency="0.038 0.028" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="lr-clip"><rect width="320" height="380"/></clipPath>
  </defs>
  <g clip-path="url(#lr-clip)">

  <!-- Sky base -->
  <rect width="320" height="380" fill="url(#lr-sky)"/>

  <!-- Atmospheric haze layers -->
  <ellipse cx="80"  cy="50"  rx="120" ry="40" fill="#f8e8a0" fill-opacity="0.18" filter="url(#lr-mist)"/>
  <ellipse cx="270" cy="35"  rx="90"  ry="32" fill="#f8e8a0" fill-opacity="0.15" filter="url(#lr-mist)"/>
  <ellipse cx="168" cy="75"  rx="160" ry="36" fill="#f0d880" fill-opacity="0.12" filter="url(#lr-mist)"/>

  <!-- Sun glow (upper-left area) -->
  <ellipse cx="115" cy="204" rx="80" ry="80" fill="url(#lr-sun-glow)" filter="url(#lr-glow)"/>

  <!-- Horizon glow -->
  <ellipse cx="160" cy="274" rx="220" ry="90" fill="url(#lr-horizon-glow)"/>

  <!-- Soft clouds (backlit, golden) -->
  <ellipse cx="55"  cy="80"  rx="70" ry="22" fill="#f0d070" fill-opacity="0.25" filter="url(#lr-mist)"/>
  <ellipse cx="230" cy="65"  rx="60" ry="18" fill="#f0d070" fill-opacity="0.2"  filter="url(#lr-mist)"/>
  <ellipse cx="160" cy="110" rx="80" ry="20" fill="#e8c060" fill-opacity="0.15" filter="url(#lr-mist)"/>
  <ellipse cx="290" cy="100" rx="50" ry="16" fill="#f0d070" fill-opacity="0.18" filter="url(#lr-mist)"/>

  <!-- Sun disc (partially behind far hill) -->
  <ellipse cx="115" cy="205" rx="34" ry="34" fill="#fff8c0" fill-opacity="0.95" filter="url(#lr-glow)"/>
  <ellipse cx="115" cy="205" rx="24" ry="24" fill="#fffce8"/>
  <ellipse cx="115" cy="205" rx="16" ry="16" fill="#fffff4"/>

  <!-- Far hills -->
  <path d="M0 210 Q35 188 75 202 Q115 180 158 196 Q198 178 240 193 Q278 178 320 192
           L320 258 L0 258 Z"
        fill="url(#lr-hill-far)" fill-opacity="0.88" filter="url(#lr-paint)"/>

  <!-- Mid hills -->
  <path d="M0 228 Q32 208 68 222 Q108 202 150 216 Q190 198 232 213 Q270 198 310 212 L320 218
           L320 268 L0 268 Z"
        fill="url(#lr-hill-mid)" fill-opacity="0.92" filter="url(#lr-paint)"/>

  <!-- Near hills -->
  <path d="M0 248 Q28 228 58 242 Q90 222 128 236 Q162 220 198 234 Q232 218 268 232 L320 238
           L320 280 L0 280 Z"
        fill="url(#lr-hill-near)" fill-opacity="0.95" filter="url(#lr-paint)"/>

  <!-- Ground (foreground) -->
  <path d="M0 272 Q40 260 80 270 Q120 256 162 268 Q202 256 244 268 Q280 257 320 268
           L320 380 L0 380 Z"
        fill="url(#lr-ground)"/>

  <!-- Grass tufts (foreground) -->
  <path d="M20 278 Q22 270 24 278 Q25 272 28 278" stroke="#4a3010" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M55 275 Q57 267 59 275 Q60 269 63 275" stroke="#4a3010" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M255 280 Q257 272 259 280 Q260 274 263 280" stroke="#4a3010" stroke-width="1.5" fill="none" opacity="0.52"/>
  <path d="M295 276 Q297 268 299 276 Q300 270 303 276" stroke="#4a3010" stroke-width="1.5" fill="none" opacity="0.48"/>
  <path d="M108 282 Q110 274 112 282 Q113 276 116 282" stroke="#4a3010" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Winding path -->
  <!-- Path shadow -->
  <path d="M155 380 Q156 358 158 338 Q160 318 162 298 Q163 282 162 268"
        stroke="#3a1e08" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.45"/>
  <!-- Path surface -->
  <path d="M155 380 Q156 358 158 338 Q160 318 162 298 Q163 282 162 268"
        stroke="#c89040" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Path highlight -->
  <path d="M157 378 Q158 356 159 336 Q161 316 163 296 Q164 280 163 266"
        stroke="#e0b060" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- Tree trunk and roots -->
  <path d="M154 268 Q152 255 155 240 Q158 225 160 210 Q162 198 160 185"
        stroke="#3c1e08" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.92"/>
  <!-- Root spread -->
  <path d="M154 268 Q148 272 140 270 Q148 266 154 262" stroke="#3c1e08" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M160 268 Q168 272 176 268 Q168 264 162 260" stroke="#3c1e08" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Main branches -->
  <path d="M160 195 Q148 180 138 168 Q128 158 122 145" stroke="#3c1e08" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M160 195 Q172 178 182 165 Q192 152 198 140" stroke="#3c1e08" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M160 208 Q145 196 132 190 Q120 184 112 176" stroke="#3c1e08" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M160 208 Q175 196 188 190 Q200 184 208 176" stroke="#3c1e08" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Sub-branches -->
  <path d="M138 168 Q130 155 124 143" stroke="#3c1e08" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M138 168 Q132 158 128 148" stroke="#3c1e08" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M182 165 Q190 153 196 140" stroke="#3c1e08" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M182 165 Q188 157 192 148" stroke="#3c1e08" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M122 145 Q118 134 116 122" stroke="#3c1e08" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M198 140 Q204 128 206 116" stroke="#3c1e08" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Tree canopy — layered ellipses for depth (dark to light) -->
  <!-- Base deep shadow layer -->
  <ellipse cx="160" cy="165" rx="75" ry="55" fill="#2e1808" fill-opacity="0.72" filter="url(#lr-soft)"/>
  <!-- Mid canopy -->
  <ellipse cx="152" cy="158" rx="65" ry="48" fill="#3c2210" fill-opacity="0.78"/>
  <ellipse cx="170" cy="162" rx="60" ry="45" fill="#3a2010" fill-opacity="0.74"/>
  <!-- Upper canopy (backlit gold) -->
  <ellipse cx="155" cy="145" rx="52" ry="40" fill="#503018" fill-opacity="0.8"/>
  <ellipse cx="168" cy="142" rx="48" ry="38" fill="#503018" fill-opacity="0.76"/>
  <!-- Top canopy (bright golden edge) -->
  <ellipse cx="158" cy="130" rx="42" ry="32" fill="#684020" fill-opacity="0.82"/>
  <ellipse cx="165" cy="128" rx="38" ry="30" fill="#704828" fill-opacity="0.78"/>
  <!-- Golden rim highlights (backlit) -->
  <path d="M120 130 Q138 108 160 118 Q182 108 200 132"
        stroke="#e8a830" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M125 145 Q142 125 160 135 Q178 125 195 148"
        stroke="#c88820" stroke-width="2" fill="none" opacity="0.28" stroke-linecap="round"/>
  <!-- Golden leaf highlights scattered -->
  <ellipse cx="130" cy="128" rx="8" ry="5" fill="#c88020" fill-opacity="0.35" transform="rotate(-30,130,128)"/>
  <ellipse cx="192" cy="125" rx="7" ry="4" fill="#c88020" fill-opacity="0.32" transform="rotate(25,192,125)"/>
  <ellipse cx="158" cy="108" rx="9" ry="5" fill="#d09030" fill-opacity="0.3" transform="rotate(-5,158,108)"/>
  <ellipse cx="145" cy="118" rx="6" ry="3.5" fill="#c08020" fill-opacity="0.28" transform="rotate(-20,145,118)"/>
  <ellipse cx="178" cy="115" rx="6" ry="3.5" fill="#c08020" fill-opacity="0.28" transform="rotate(15,178,115)"/>

  <!-- Vignette -->
  <rect width="320" height="380" fill="url(#lr-vign)"/>

  </g>
</svg>
