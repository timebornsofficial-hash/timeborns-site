<svg viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="w2-space" cx="42%" cy="36%" r="75%">
      <stop offset="0%"   stop-color="#0e1c38"/>
      <stop offset="35%"  stop-color="#081428"/>
      <stop offset="70%"  stop-color="#040c1c"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <radialGradient id="w2-nebula1" cx="35%" cy="30%" r="45%">
      <stop offset="0%"   stop-color="#1a3060" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#0e1e48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08142e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2-nebula2" cx="70%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#182850" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="#0c1838" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08102c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2-milky" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c8d8f0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8d8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w2-whale-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a4878"/>
      <stop offset="40%"  stop-color="#1e3868"/>
      <stop offset="100%" stop-color="#142e58"/>
    </linearGradient>
    <radialGradient id="w2-whale-belly" cx="50%" cy="65%" r="45%">
      <stop offset="0%"   stop-color="#4a78b8" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#2a5090" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a3878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2-vign" cx="50%" cy="50%" r="70%">
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#010408" stop-opacity="0.78"/>
    </radialGradient>
    <filter id="w2-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="w2-starglow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="w2-soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="w2-clip"><rect width="320" height="380"/></clipPath>
  </defs>
  <g clip-path="url(#w2-clip)">

  <!-- Deep space background -->
  <rect width="320" height="380" fill="url(#w2-space)"/>

  <!-- Nebula volumes -->
  <ellipse cx="112" cy="114" rx="145" ry="120" fill="url(#w2-nebula1)"/>
  <ellipse cx="224" cy="228" rx="130" ry="110" fill="url(#w2-nebula2)"/>

  <!-- Milky way band (diagonal) -->
  <rect x="-40" y="60" width="420" height="80" rx="40" fill="url(#w2-milky)"
        transform="rotate(-22,160,100)" filter="url(#w2-soft)"/>

  <!-- Dense star field — tiny stars -->
  <circle cx="12"  cy="18"  r="0.7" fill="#c0d0f0" opacity="0.7"/>
  <circle cx="28"  cy="8"   r="0.8" fill="#d8e4ff" opacity="0.8"/>
  <circle cx="48"  cy="22"  r="0.6" fill="#c0d0f0" opacity="0.65"/>
  <circle cx="65"  cy="12"  r="0.9" fill="#e0eaff" opacity="0.85"/>
  <circle cx="82"  cy="30"  r="0.7" fill="#c8d8f0" opacity="0.7"/>
  <circle cx="100" cy="8"   r="0.6" fill="#c0d0f0" opacity="0.6"/>
  <circle cx="118" cy="20"  r="0.8" fill="#d8e4ff" opacity="0.75"/>
  <circle cx="135" cy="6"   r="0.7" fill="#c8d8f0" opacity="0.65"/>
  <circle cx="155" cy="24"  r="0.9" fill="#e0eaff" opacity="0.8"/>
  <circle cx="172" cy="10"  r="0.6" fill="#c0d0f0" opacity="0.7"/>
  <circle cx="190" cy="28"  r="0.8" fill="#d0dcf8" opacity="0.72"/>
  <circle cx="208" cy="14"  r="0.7" fill="#c8d8f0" opacity="0.68"/>
  <circle cx="224" cy="6"   r="0.9" fill="#e0eaff" opacity="0.78"/>
  <circle cx="242" cy="22"  r="0.6" fill="#c0d0f0" opacity="0.62"/>
  <circle cx="260" cy="10"  r="0.8" fill="#d8e4ff" opacity="0.75"/>
  <circle cx="278" cy="26"  r="0.7" fill="#c8d8f0" opacity="0.7"/>
  <circle cx="295" cy="12"  r="0.6" fill="#c0d0f0" opacity="0.65"/>
  <circle cx="314" cy="20"  r="0.9" fill="#e0eaff" opacity="0.8"/>
  <circle cx="22"  cy="42"  r="0.7" fill="#c8d8f0" opacity="0.68"/>
  <circle cx="42"  cy="56"  r="0.8" fill="#d8e4ff" opacity="0.72"/>
  <circle cx="58"  cy="44"  r="0.6" fill="#c0d0f0" opacity="0.6"/>
  <circle cx="75"  cy="62"  r="0.9" fill="#e0eaff" opacity="0.8"/>
  <circle cx="92"  cy="48"  r="0.7" fill="#c8d8f0" opacity="0.7"/>
  <circle cx="112" cy="58"  r="0.6" fill="#c0d0f0" opacity="0.62"/>
  <circle cx="128" cy="44"  r="0.8" fill="#d8e4ff" opacity="0.75"/>
  <circle cx="148" cy="66"  r="0.7" fill="#c8d8f0" opacity="0.65"/>
  <circle cx="165" cy="50"  r="0.9" fill="#e0eaff" opacity="0.82"/>
  <circle cx="182" cy="64"  r="0.6" fill="#c0d0f0" opacity="0.6"/>
  <circle cx="200" cy="48"  r="0.8" fill="#d0dcf8" opacity="0.72"/>
  <circle cx="218" cy="68"  r="0.7" fill="#c8d8f0" opacity="0.7"/>
  <circle cx="236" cy="52"  r="0.6" fill="#c0d0f0" opacity="0.62"/>
  <circle cx="252" cy="66"  r="0.9" fill="#e0eaff" opacity="0.78"/>
  <circle cx="270" cy="50"  r="0.7" fill="#c8d8f0" opacity="0.68"/>
  <circle cx="288" cy="64"  r="0.8" fill="#d8e4ff" opacity="0.74"/>
  <circle cx="305" cy="48"  r="0.6" fill="#c0d0f0" opacity="0.6"/>

  <!-- Medium stars -->
  <circle cx="38"  cy="35"  r="1.2" fill="#e8f0ff" opacity="0.88" filter="url(#w2-starglow)"/>
  <circle cx="88"  cy="16"  r="1.1" fill="#f0f4ff" opacity="0.9"  filter="url(#w2-starglow)"/>
  <circle cx="145" cy="38"  r="1.3" fill="#e0ecff" opacity="0.85" filter="url(#w2-starglow)"/>
  <circle cx="205" cy="20"  r="1.2" fill="#e8f0ff" opacity="0.88" filter="url(#w2-starglow)"/>
  <circle cx="268" cy="38"  r="1.1" fill="#f0f4ff" opacity="0.9"  filter="url(#w2-starglow)"/>
  <circle cx="310" cy="55"  r="1.2" fill="#e0ecff" opacity="0.85" filter="url(#w2-starglow)"/>
  <circle cx="55"  cy="75"  r="1.3" fill="#e8f0ff" opacity="0.88" filter="url(#w2-starglow)"/>
  <circle cx="178" cy="88"  r="1.2" fill="#f0f4ff" opacity="0.9"  filter="url(#w2-starglow)"/>
  <circle cx="250" cy="82"  r="1.4" fill="#e0ecff" opacity="0.86" filter="url(#w2-starglow)"/>

  <!-- Bright/prominent stars -->
  <circle cx="62"  cy="52"  r="2"   fill="#f8faff" opacity="0.95" filter="url(#w2-glow)"/>
  <circle cx="188" cy="32"  r="1.8" fill="#f8faff" opacity="0.95" filter="url(#w2-glow)"/>
  <circle cx="295" cy="30"  r="2"   fill="#f8faff" opacity="0.95" filter="url(#w2-glow)"/>
  <circle cx="122" cy="72"  r="1.8" fill="#f8faff" opacity="0.92" filter="url(#w2-glow)"/>
  <circle cx="242" cy="58"  r="2.2" fill="#f8faff" opacity="0.95" filter="url(#w2-glow)"/>

  <!-- Constellation lines (gold) -->
  <line x1="62"  y1="52"  x2="122" y2="72"  stroke="#c0b058" stroke-width="0.55" opacity="0.35"/>
  <line x1="122" y1="72"  x2="188" y2="32"  stroke="#c0b058" stroke-width="0.55" opacity="0.32"/>
  <line x1="188" y1="32"  x2="242" y2="58"  stroke="#c0b058" stroke-width="0.55" opacity="0.35"/>
  <line x1="242" y1="58"  x2="295" y2="30"  stroke="#c0b058" stroke-width="0.5"  opacity="0.28"/>
  <line x1="62"  y1="52"  x2="38"  cy="35" stroke="#c0b058" stroke-width="0.45" opacity="0.25"/>
  <!-- extra -->
  <line x1="145" y1="38"  x2="188" y2="32"  stroke="#c0b058" stroke-width="0.45" opacity="0.28"/>
  <line x1="88"  y1="16"  x2="145" y2="38"  stroke="#c0b058" stroke-width="0.45" opacity="0.25"/>
  <line x1="242" y1="58"  x2="250" y2="82"  stroke="#c0b058" stroke-width="0.4"  opacity="0.22"/>

  <!-- Whale body (large, swimming upward-left diagonally) -->
  <!-- Tail fluke -->
  <path d="M245 268 Q255 248 250 238 Q258 245 268 242 Q260 256 265 272 Q255 266 245 268 Z"
        fill="#1e3868" fill-opacity="0.9"/>
  <path d="M245 268 Q240 252 236 244 Q228 252 224 260 Q234 268 245 268 Z"
        fill="#1e3868" fill-opacity="0.88"/>
  <!-- Main body -->
  <path d="M245 268 Q220 258 192 242 Q168 228 148 210 Q130 194 118 178 Q108 166 105 152
           Q108 138 118 130 Q132 124 148 130 Q165 138 182 150 Q202 164 222 182
           Q240 198 255 218 Q268 238 265 260 Z"
        fill="url(#w2-whale-body)" fill-opacity="0.94"/>
  <!-- Belly highlight -->
  <path d="M245 268 Q225 262 200 250 Q178 238 162 224 Q148 212 138 198 Q128 186 122 172
           Q118 160 120 148 Q125 140 132 136"
        stroke="#4a78b8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.28"/>
  <!-- Belly overlay -->
  <ellipse cx="168" cy="202" rx="55" ry="28" fill="url(#w2-whale-belly)" transform="rotate(-42,168,202)"/>
  <!-- Pectoral fin -->
  <path d="M170 216 Q158 228 148 240 Q158 240 168 232 Q176 226 178 218 Z"
        fill="#1a3460" fill-opacity="0.85"/>
  <!-- Dorsal fin -->
  <path d="M200 178 Q196 162 204 152 Q210 162 210 175 Z"
        fill="#182e58" fill-opacity="0.9"/>
  <!-- Head definition -->
  <path d="M105 152 Q100 144 102 136 Q108 130 116 132 Q122 136 122 144 Q118 150 110 154 Z"
        fill="#162c50" fill-opacity="0.9"/>
  <!-- Bioluminescent eye -->
  <circle cx="112" cy="142" r="3" fill="#60a8e0" fill-opacity="0.85" filter="url(#w2-glow)"/>
  <circle cx="112" cy="142" r="1.5" fill="#c0e8ff" fill-opacity="0.95"/>

  <!-- Bioluminescent spots on whale body -->
  <circle cx="148" cy="208" r="2.2" fill="#78c8f0" fill-opacity="0.7" filter="url(#w2-starglow)"/>
  <circle cx="168" cy="194" r="1.8" fill="#78c8f0" fill-opacity="0.65" filter="url(#w2-starglow)"/>
  <circle cx="188" cy="182" r="2"   fill="#78c8f0" fill-opacity="0.68" filter="url(#w2-starglow)"/>
  <circle cx="128" cy="222" r="1.5" fill="#78c8f0" fill-opacity="0.6"  filter="url(#w2-starglow)"/>
  <circle cx="208" cy="172" r="1.6" fill="#78c8f0" fill-opacity="0.62" filter="url(#w2-starglow)"/>
  <circle cx="228" cy="194" r="1.4" fill="#60b8e0" fill-opacity="0.55" filter="url(#w2-starglow)"/>

  <!-- Particle trail -->
  <circle cx="262" cy="242" r="1.2" fill="#78b8e8" fill-opacity="0.5"/>
  <circle cx="270" cy="252" r="0.9" fill="#78b8e8" fill-opacity="0.4"/>
  <circle cx="255" cy="255" r="1"   fill="#78b8e8" fill-opacity="0.45"/>

  <!-- Stars overlapping whale area -->
  <circle cx="135" cy="160" r="0.9" fill="#d0dcf0" opacity="0.6"/>
  <circle cx="220" cy="145" r="0.8" fill="#d8e8ff" opacity="0.65"/>
  <circle cx="160" cy="180" r="0.7" fill="#c8d8f0" opacity="0.5"/>

  <!-- More stars lower region -->
  <circle cx="18"  cy="138" r="0.7" fill="#c8d8f0" opacity="0.65"/>
  <circle cx="35"  cy="152" r="0.6" fill="#c0d0f0" opacity="0.58"/>
  <circle cx="55"  cy="142" r="0.8" fill="#d8e4ff" opacity="0.7"/>
  <circle cx="72"  cy="162" r="0.7" fill="#c8d8f0" opacity="0.65"/>
  <circle cx="288" cy="142" r="0.7" fill="#c8d8f0" opacity="0.65"/>
  <circle cx="308" cy="155" r="0.6" fill="#c0d0f0" opacity="0.58"/>
  <circle cx="278" cy="168" r="0.8" fill="#d8e4ff" opacity="0.7"/>

  <!-- Small standing figure at bottom center, looking up -->
  <g transform="translate(152,328)" opacity="0.72">
    <circle cx="8"  cy="0"  r="5"   fill="#304878"/>
    <rect   x="5"   y="5"   width="6" height="12" rx="1.5" fill="#304878"/>
    <line x1="4"  y1="10" x2="0"  y2="17" stroke="#304878" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="14" y2="17" stroke="#304878" stroke-width="2" stroke-linecap="round"/>
    <line x1="6"  y1="17" x2="5"  y2="26" stroke="#304878" stroke-width="2" stroke-linecap="round"/>
    <line x1="9"  y1="17" x2="10" y2="26" stroke="#304878" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Reflection glow from figure's light source -->
  <ellipse cx="160" cy="360" rx="18" ry="6" fill="#2a4878" fill-opacity="0.3" filter="url(#w2-soft)"/>

  <!-- Ocean surface at bottom -->
  <rect x="0" y="344" width="320" height="36" fill="#060e22" fill-opacity="0.85"/>
  <path d="M0 344 Q80 340 160 344 Q240 348 320 344" stroke="#1a2e58" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Vignette -->
  <rect width="320" height="380" fill="url(#w2-vign)"/>

  </g>
</svg>
